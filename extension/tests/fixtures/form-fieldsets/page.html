<!doctype html>
<html>
  <head><title>Checkout</title></head>
  <body>
    <form aria-label="Shipping">
      <fieldset>
        <legend>Contact</legend>
        <label for="email">Email</label>
        <input id="email" type="email" value="ash@example.com">
      </fieldset>
      <fieldset>
        <legend>Address</legend>
        <label for="street">Street</label>
        <input id="street" type="text" value="123 Main St">
      </fieldset>
      <button>Continue</button>
    </form>
  </body>
</html>
