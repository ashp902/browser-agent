<!doctype html>
<html>
  <head><title>Hidden content</title></head>
  <body>
    <main>
      <button>Visible action</button>

      <button hidden>Hidden attribute button</button>

      <div aria-hidden="true">
        <button>Aria hidden button</button>
      </div>

      <div style="display: none">
        <button>Display none button</button>
      </div>

      <details>
        <summary>More options</summary>
        <button>Closed details button</button>
      </details>
    </main>
  </body>
</html>
