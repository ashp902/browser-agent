<!doctype html>
<html>
  <head><title>Inbox</title></head>
  <body>
    <main>
      <section aria-label="Notifications">
        <!-- Minimal repeated containers: no headings, text identifies each item -->
        <div class="notification">
          <p>Your order #1004 has shipped.</p>
          <button>Dismiss</button>
        </div>
        <div class="notification">
          <p>Price drop on a saved item.</p>
          <button>Dismiss</button>
        </div>
        <div class="notification">
          <p>New login from a recognized device.</p>
          <button>Dismiss</button>
        </div>
      </section>
    </main>
  </body>
</html>
