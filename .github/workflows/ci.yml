name: ci

on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run lint
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm run test
        working-directory: extension
      - run: npm run build
        working-directory: extension

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: pytest
        working-directory: backend

  test-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test-site/package-lock.json
      - run: npm ci
        working-directory: test-site
      - run: npm run typecheck
        working-directory: test-site
      - run: npm run build
        working-directory: test-site

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test tests/smoke.spec.ts
        working-directory: e2e
